version: '3.8'

services:
  # Main application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magic-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HTTPS_PORT=3443
      - SSL_CERT_PATH=/etc/ssl/certs/cert.pem
      - SSL_KEY_PATH=/etc/ssl/private/key.pem
    ports:
      - "3000:3000"
      - "3443:3443"
    volumes:
      - ./certs:/etc/ssl/certs:ro
      - ./certs:/etc/ssl/private:ro
      - app-logs:/var/log/app
    networks:
      - magic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: magic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - ./certs:/etc/ssl/private:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - magic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for automatic Let's Encrypt certificates (optional)
  certbot:
    image: certbot/certbot
    container_name: magic-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    profiles:
      - ssl
    networks:
      - magic-network

networks:
  magic-network:
    driver: bridge

volumes:
  app-logs:
  nginx-logs: