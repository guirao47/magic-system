<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panel Mago">
  <title>Panel del Mago</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #16213e;
      --primary: #e94560;
      --primary-hover: #ff6b6b;
      --text: #eaeaea;
      --text-muted: #888;
      --border: #2a2a4a;
      --success: #00d4aa;
      --warning: #ffbe0b;
      --error: #ff3366;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f5;
        --bg-card: #ffffff;
        --bg-input: #f0f0f0;
        --primary: #e94560;
        --primary-hover: #d63447;
        --text: #1a1a2e;
        --text-muted: #666;
        --border: #ddd;
        --shadow: 0 4px 20px rgba(0,0,0,0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .app-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .app-title::before { content: '🎩'; font-size: 1.5rem; }
    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: var(--bg-input);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--error);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--success); }
    .status-dot.connecting { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    main { flex: 1; padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; width: 100%; }
    .section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .section-title { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-title::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--primary); }
    .session-selector { margin-bottom: 1rem; }
    .session-select { width: 100%; padding: 1rem; font-size: 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; appearance: none; cursor: pointer; }
    .session-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(233,69,96,0.2); }
    .session-select:disabled { opacity: 0.5; cursor: not-allowed; }
    .engine-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
    .engine-btn { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1rem 0.75rem; background: var(--bg-input); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; cursor: pointer; transition: all 0.2s; min-height: 80px; }
    .engine-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
    .engine-btn.active { border-color: var(--primary); background: rgba(233,69,96,0.15); }
    .engine-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(233,69,96,0.3); }
    .engine-icon { font-size: 1.5rem; }
    .engine-name { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .search-input-wrapper { position: relative; margin-bottom: 1rem; }
    .search-input { width: 100%; padding: 1rem 1rem 1rem 3rem; font-size: 1.125rem; background: var(--bg-input); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; transition: all 0.2s; }
    .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(233,69,96,0.2); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.25rem; color: var(--text-muted); pointer-events: none; }
    .send-btn { width: 100%; padding: 1rem; font-size: 1.125rem; font-weight: 700; font-family: inherit; color: white; background: linear-gradient(135deg, var(--primary), #d63447); border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(233,69,96,0.4); }
    .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.5); }
    .send-btn:active:not(:disabled) { transform: translateY(0); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .send-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(233,69,96,0.5); }
    .hint { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem; }
    .last-sent { background: rgba(0,212,170,0.1); border: 1px solid var(--success); border-radius: 12px; padding: 1rem; display: none; }
    .last-sent.visible { display: block; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .last-sent-title { font-size: 0.75rem; font-weight: 600; color: var(--success); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .last-sent-detail { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.875rem; }
    .last-sent-engine { font-weight: 600; color: var(--primary); }
    .last-sent-query { font-family: monospace; color: var(--text); }
    .last-sent-time { font-size: 0.75rem; color: var(--text-muted); }
    .footer { padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.75rem; border-top: 1px solid var(--border); margin-top: auto; }
    @media (max-width: 480px) {
      .engine-grid { grid-template-columns: 1fr; }
      .engine-btn { flex-direction: row; justify-content: flex-start; min-height: 60px; }
      .engine-name { font-size: 0.875rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">Panel del Mago</h1>
      <div class="connection-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Conectando...</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Selector de Sesión -->
    <section class="section">
      <h2 class="section-title">Sesión del Espectador</h2>
      <div class="session-selector">
        <select class="session-select" id="sessionSelect" disabled>
          <option value="">Conectando al servidor...</option>
        </select>
      </div>
      <p class="hint" id="sessionHint">El espectador debe abrir su URL primero</p>
    </section>

    <!-- Selector de Motor de Búsqueda -->
    <section class="section">
      <h2 class="section-title">Motor de Búsqueda</h2>
      <div class="engine-grid" id="engineGrid">
        <!-- Se llena por JS -->
      </div>
      <p class="hint">Selecciona dónde buscar</p>
    </section>

    <!-- Entrada de Búsqueda -->
    <section class="section">
      <h2 class="section-title">Término a Buscar</h2>
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Escribe lo que diga el espectador..." autocomplete="off" spellcheck="false" disabled>
      </div>
      <button class="send-btn" id="sendBtn" disabled>ENVIAR AL ESPECTADOR</button>
      <p class="hint" id="sendHint">Selecciona sesión y motor primero</p>
    </section>

    <!-- Último Enviado -->
    <section class="section last-sent" id="lastSent">
      <div class="last-sent-title">Último envío</div>
      <div class="last-sent-detail">
        <span class="last-sent-engine" id="lastEngine">—</span>
        <span class="last-sent-query" id="lastQuery">—</span>
        <span class="last-sent-time" id="lastTime">—</span>
      </div>
    </section>
  </main>

  <footer class="footer">
    Panel del Mago • WebSocket en tiempo real
  </footer>

  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.min.js"></script>
  <script>
    // ===== CONFIG =====
    const ENGINES = [
      { id: 'google', name: 'Google', icon: '🔍', color: '#4285f4' },
      { id: 'youtube', name: 'YouTube', icon: '▶️', color: '#ff0000' },
      { id: 'maps', name: 'Maps', icon: '🗺️', color: '#4285f4' },
      { id: 'wikipedia', name: 'Wikipedia', icon: '📖', color: '#000000' },
      { id: 'images', name: 'Imágenes', icon: '🖼️', color: '#4285f4' }
    ];

    // ===== STATE =====
    let socket = null;
    let selectedEngine = 'google';
    let selectedSession = null;
    let sessions = [];

    // ===== DOM =====
    const els = {
      statusDot: document.getElementById('statusDot'),
      statusText: document.getElementById('statusText'),
      sessionSelect: document.getElementById('sessionSelect'),
      sessionHint: document.getElementById('sessionHint'),
      engineGrid: document.getElementById('engineGrid'),
      searchInput: document.getElementById('searchInput'),
      sendBtn: document.getElementById('sendBtn'),
      sendHint: document.getElementById('sendHint'),
      lastSent: document.getElementById('lastSent'),
      lastEngine: document.getElementById('lastEngine'),
      lastQuery: document.getElementById('lastQuery'),
      lastTime: document.getElementById('lastTime')
    };

    // ===== INIT =====
    function init() {
      renderEngines();
      connectSocket();
      bindEvents();
    }

    // ===== RENDER =====
    function renderEngines() {
      els.engineGrid.innerHTML = ENGINES.map(e => `
        <button type="button" class="engine-btn ${e.id === selectedEngine ? 'active' : ''}" data-engine="${e.id}" style="--engine-color: ${e.color};">
          <span class="engine-icon">${e.icon}</span>
          <span class="engine-name">${e.name}</span>
        </button>
      `).join('');
    }

    function updateEngineButtons() {
      document.querySelectorAll('.engine-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.engine === selectedEngine);
      });
    }

    function renderSessions(list) {
      sessions = list;
      if (list.length === 0) {
        els.sessionSelect.innerHTML = '<option value="">No hay espectadores conectados</option>';
        els.sessionSelect.disabled = true;
        els.sessionHint.textContent = 'El espectador debe abrir su URL primero';
      } else {
        els.sessionSelect.innerHTML = list.map(s =>
          `<option value="${s.sessionId}">Sesión ${s.sessionId} (${formatTime(s.createdAt)})</option>`
        ).join('');
        els.sessionSelect.disabled = false;
        els.sessionHint.textContent = 'Elige la sesión del espectador';

        // Auto-seleccionar la primera si no hay selección
        if (!selectedSession) {
          selectSession(list[0].sessionId);
        }
      }
      updateSendBtn();
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function showLastSent(data) {
      els.lastEngine.textContent = ENGINES.find(e => e.id === data.engine)?.name || data.engine;
      els.lastQuery.textContent = `"${data.query}"`;
      els.lastTime.textContent = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      els.lastSent.classList.add('visible');
    }

    function setConnectionStatus(status) {
      els.statusDot.className = 'status-dot ' + status;
      const texts = { connected: 'Conectado', connecting: 'Conectando...', disconnected: 'Desconectado' };
      els.statusText.textContent = texts[status] || status;
    }

    function updateSendBtn() {
      const canSend = socket?.connected && selectedSession && selectedEngine && els.searchInput.value.trim();
      els.sendBtn.disabled = !canSend;
      els.searchInput.disabled = !selectedSession;

      if (!socket?.connected) {
        els.sendHint.textContent = 'Esperando conexión...';
      } else if (!selectedSession) {
        els.sendHint.textContent = 'Selecciona una sesión';
      } else if (!selectedEngine) {
        els.sendHint.textContent = 'Selecciona un motor';
      } else if (!els.searchInput.value.trim()) {
        els.sendHint.textContent = 'Escribe el término a buscar';
      } else {
        els.sendHint.textContent = 'Listo para enviar';
      }
    }

    // ===== SOCKET =====
    function connectSocket() {
      // Usar mismo origen que la página
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host;
      const serverUrl = `${protocol}//${host}`;

      console.log('Conectando a:', serverUrl);

      socket = io(serverUrl, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 10,
        reconnectionDelay: 1000
      });

      socket.on('connect', () => {
        console.log('Conectado:', socket.id);
        setConnectionStatus('connected');
        socket.emit('magician-join');
        updateSendBtn();
      });

      socket.on('disconnect', (reason) => {
        console.log('Desconectado:', reason);
        setConnectionStatus('disconnected');
        updateSendBtn();
      });

      socket.on('connect_error', (err) => {
        console.error('Error de conexión:', err);
        setConnectionStatus('disconnected');
      });

      // Eventos del servidor
      socket.on('magician-joined', (data) => {
        console.log('Sesiones activas:', data.sessions);
        renderSessions(data.sessions || []);
      });

      socket.on('viewer-waiting', (data) => {
        console.log('Nuevo viewer:', data.sessionId);
        socket.emit('magician-join'); // Refrescar lista
      });

      socket.on('viewer-disconnected', (data) => {
        console.log('Viewer desconectado:', data.sessionId);
        sessions = sessions.filter(s => s.sessionId !== data.sessionId);
        renderSessions(sessions);
        if (selectedSession === data.sessionId) {
          selectSession(null);
        }
      });

      socket.on('session-selected', (data) => {
        selectSession(data.sessionId);
      });

      socket.on('search-sent', (data) => {
        console.log('Búsqueda enviada:', data);
        showLastSent(data);
        els.searchInput.value = '';
        updateSendBtn();
      });

      socket.on('error', (data) => {
        console.error('Error servidor:', data.message);
        alert('Error: ' + data.message);
      });
    }

    // ===== EVENTOS UI =====
    function bindEvents() {
      // Selector de sesión
      els.sessionSelect.addEventListener('change', (e) => {
        selectSession(e.target.value || null);
      });

      // Botones de motor
      els.engineGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('.engine-btn');
        if (btn) selectEngine(btn.dataset.engine);
      });

      // Input búsqueda
      els.searchInput.addEventListener('input', updateSendBtn);
      els.searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !els.sendBtn.disabled) sendSearch();
      });

      // Botón enviar
      els.sendBtn.addEventListener('click', sendSearch);
    }

    function selectEngine(engine) {
      selectedEngine = engine;
      updateEngineButtons();
      updateSendBtn();
    }

    function selectSession(sessionId) {
      selectedSession = sessionId;
      els.sessionSelect.value = sessionId || '';

      if (sessionId && socket?.connected) {
        socket.emit('magician-select-session', { sessionId });
      }
      updateSendBtn();
    }

    function sendSearch() {
      const query = els.searchInput.value.trim();
      if (!query || !selectedSession || !socket?.connected) return;

      console.log('Enviando búsqueda:', { sessionId: selectedSession, engine: selectedEngine, query });
      socket.emit('search-command', {
        sessionId: selectedSession,
        engine: selectedEngine,
        query
      });
    }

    // Iniciar
    init();
  </script>
</body>
</html>
